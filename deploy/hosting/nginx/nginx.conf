server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name _;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;

  client_max_body_size 50m;

  # Auth gateway: everything behind 2FA goes through here
  location /api/ {
    proxy_pass http://auth-gateway:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Steward portal (React app, built with --base=/steward/)
  location /steward/ {
    alias /srv/steward/;
    try_files $uri $uri/ /steward/index.html;
  }

  # Flutter mobile app built for web
  location /mobile/ {
    alias /srv/mobile/;
    try_files $uri $uri/ /mobile/index.html;
    add_header Cache-Control "no-cache";
  }

  # Participant web app (default)
  location / {
    root /srv/participant;
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 443 ssl;
  server_name emulator.benefits-eu.com;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;

  auth_basic "Emulator access";
  auth_basic_user_file /etc/nginx/htpasswd;

  location / {
    proxy_pass http://172.17.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 3600s;
  }
}
